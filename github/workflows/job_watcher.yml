name: Job Watcher

on:
  schedule:
    # Runs every 10 minutes. GitHub may delay this by a few extra minutes
    # during high load, but it will not run more slowly than this.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated seen_jobs.json

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run job watcher
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python scripts/check_jobs.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
